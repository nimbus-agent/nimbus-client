# SonarQube Cloud (SonarCloud) configuration for nimbus-client.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo/org secret set; the sonar.yml workflow skips analysis when
# the token is absent.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-client
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Source in src/ + scripts/; tests live under test/ and alongside sources in
# src/ and scripts/ (**/*.test.ts). Every directory that can hold a test file
# must appear in sonar.tests, otherwise sonar.test.inclusions — which filters
# inside sonar.tests — cannot reclassify it and Sonar analyses a test as
# production source.
sonar.sources=src,scripts
sonar.tests=src,test,scripts
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# bun test --coverage --coverage-reporter=lcov writes coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
